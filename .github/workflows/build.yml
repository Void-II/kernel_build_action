name: Build A715F Kernel with WireGuard
on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # Step 1: Checkout the kernel source (test branch)
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Void-II/A715F-Kernel-Stock
          ref: test
          path: kernel_source

      # Step 2: Configure Git identity (REQUIRED for patch script)
      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # Step 3: Patch kernel source with WireGuard
      - name: Patch Kernel with WireGuard Source
        run: |
          git clone https://git.zx2c4.com/android_kernel_wireguard.git /tmp/wg-patch
          cd /tmp/wg-patch
          ./patch-kernel.sh $GITHUB_WORKSPACE/kernel_source
          
          echo "=== Verifying WireGuard source ==="
          ls -la $GITHUB_WORKSPACE/kernel_source/net/wireguard/ | head -5
          grep -i wireguard $GITHUB_WORKSPACE/kernel_source/net/Kconfig || echo "NOT FOUND in Kconfig"
          grep -i wireguard $GITHUB_WORKSPACE/kernel_source/net/Makefile || echo "NOT FOUND in Makefile"

      # Step 4: Verify defconfig
      - name: Verify Defconfig Edits
        run: |
          DEFCONFIG="kernel_source/arch/arm64/configs/a71_eur_open_defconfig"
          grep "CONFIG_WIREGUARD" "$DEFCONFIG" || echo "NOT FOUND!"
          grep "CONFIG_LOCALVERSION" "$DEFCONFIG" || echo "NOT FOUND!"
          if ! grep -q 'CONFIG_WIREGUARD=y' "$DEFCONFIG"; then
            echo "ERROR: CONFIG_WIREGUARD=y is missing from defconfig. Aborting."
            exit 1
          fi
          echo "Defconfig verified. Proceeding to build."

      # Step 5: Build the kernel
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel_source/
          config: a71_eur_open_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          disable-lto: true
          anykernel3: true
          ksu: false
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
